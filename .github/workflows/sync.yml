name: Sync tennis data

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: tennis-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Chinese player-name cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/player-names-zh.json
          key: player-names-zh-${{ github.run_id }}
          restore-keys: player-names-zh-
      - name: Collect current tennis data
        run: python scripts/collect_open_data.py
      - name: Write normalized data to Cloudflare D1
        run: node scripts/sync.mjs
        env:
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Save Chinese player-name cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/player-names-zh.json
          key: player-names-zh-${{ github.run_id }}
