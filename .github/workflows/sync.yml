name: Sync tennis data

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: tennis-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check duckdb==1.4.0
      - name: Collect permitted open data
        run: python scripts/collect_open_data.py
      - name: Write normalized data to Cloudflare D1
        run: node scripts/sync.mjs
        env:
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
